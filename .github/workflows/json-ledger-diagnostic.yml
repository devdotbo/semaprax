name: JSON ledger diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: json-ledger-${{ github.ref }}
  cancel-in-progress: true
jobs:
  json-authentication-prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target/json-ledger-diagnostic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          lfs: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
      - name: Fetch the locked workspace dependencies before offline execution
        run: cargo fetch --locked
      - name: Observe the original native JSON authentication prefix and preserve failure
        run: >-
          cargo test --locked --offline -p semaprax --lib
          bounded_output::stage_debits::route_debits::json_codec_probe::native_json_codec_authentication_prefix_reports_ledger_and_preserves_failure
          -- --ignored --exact --nocapture --test-threads 1
